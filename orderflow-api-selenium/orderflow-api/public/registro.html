<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OrderFlow - Registro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="contenedor">
    <h2>Crear cuenta</h2>
    <div id="mensajeError" class="mensaje-error"></div>
    <div id="mensajeExito" class="mensaje-exito"></div>

    <form id="formRegistro">
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>
      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required>
      </div>
      <div class="campo">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="btn-primario" id="btnRegistro">Registrarme</button>
    </form>

    <a href="login.html" class="enlace">Ya tengo cuenta, iniciar sesion</a>
  </div>

  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
